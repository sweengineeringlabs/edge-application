[package]
name                   = "edge-application-event-store-handler-example"
version                = "0.1.0"
edition.workspace      = true
license.workspace      = true
rust-version.workspace = true
authors.workspace      = true
repository.workspace   = true
description = "Handler holding an injected EventStore<Event> via constructor injection, aggregate id/event payload carried through Self::Request — the generic-per-type port wiring pattern, issue #149"
publish = false

[package.metadata.arch]
application_type = "binary"
service_type = "orchestrator"

[[bin]]
name = "event_store_handler"
path = "main/src/main.rs"

[dependencies]
async-trait.workspace               = true
edge-application-base.workspace     = true
edge-application-handler.workspace  = true
edge-application-command.workspace  = true
edge-application-observer.workspace = true
edge-application-event.workspace    = true
edge-security-runtime.workspace     = true
tracing.workspace                   = true
tracing-subscriber.workspace        = true

[dependencies.tokio]
workspace = true
features  = ["macros", "rt", "rt-multi-thread"]

[dev-dependencies]
futures.workspace = true

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
